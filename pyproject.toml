[project]
name = "py-final-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MainHHH", email = "bmn0330@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "koreanize-matplotlib>=0.1.1",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
